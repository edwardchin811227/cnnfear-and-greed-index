name: 每日更新 CNN Fear & Greed

# CNN 的日度資料點固定在 00:00 UTC 定稿（美東收盤後 3~5 小時，即香港時間 08:00）。
# 因此主排程排在 00:10 UTC（香港 08:10），與本機排程的 08:10 對齊。
# 注意：GitHub 的 schedule 在尖峰時段可能延遲數分鐘至數十分鐘，故加排一次保險重試。

on:
  schedule:
    - cron: "10 0 * * *"      # 00:10 UTC = 香港 08:10 —— CNN 定稿後 10 分鐘
    - cron: "40 0 * * *"      # 00:40 UTC = 香港 08:40 —— 保險重試
    - cron: "20 21 * * 1-5"   # 21:20 UTC = 美東收盤後（冬令時間提前拿到）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fng-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch and process
        run: python scripts/fetch_and_process.py --backfill-days 10

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fng.csv docs/fng_data.json
          if git diff --cached --quiet; then
            echo "資料無變動，不產生 commit。"
            exit 0
          fi
          git commit -m "data: update fng $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
