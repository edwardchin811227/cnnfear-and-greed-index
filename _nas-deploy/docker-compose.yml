version: "3.8"

services:
  cnnfng:
    build: .
    container_name: cnnfng
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - HTTPS_PROXY=http://192.168.31.237:7890
      - HTTP_PROXY=http://192.168.31.237:7890
      - NO_PROXY=localhost,127.0.0.1,.local
    volumes:
      - ./id_rsa:/root/.ssh/id_rsa:ro
      - cnnfng_data:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cnnfng_data:
